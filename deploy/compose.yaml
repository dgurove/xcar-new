# Боевой стек xcar-new. Обычный docker compose. Настройки приложения — из
# `.env.app` рядом (в git не лежит, образец `.env.app.example`), настройки
# стека — из `.env`.
#
# Данные лежат не в томах, а на втором диске `${XCAR_DATA}` (см.
# `server-setup.sh`): `storage/` — рабочие каталоги Laravel, поверх него
# `media/` (публичное, Caddy отдаёт сам), `private/` (письма, документы),
# `cache/` (воспроизводимое, не бэкапится), `postgres/` — база. Так бэкап и
# `du` видят каждую часть отдельно. Сжатые версии фото — `${XCAR_HOT}` на
# корневом SSD (пересчитываемое, не бэкапится): списки с фото грузятся с него.
name: xcar

x-data: &data
  - ${XCAR_DATA:-/srv/xcar/data}/storage:/app/storage
  - ${XCAR_DATA:-/srv/xcar/data}/media:/app/storage/app/media
  - ${XCAR_DATA:-/srv/xcar/data}/private:/app/storage/app/private
  - ${XCAR_DATA:-/srv/xcar/data}/cache:/app/storage/app/cache
  - ${XCAR_HOT:-/srv/xcar/hot}:/app/storage/app/hot

x-app: &app
  image: xcar/app:${TAG:?нужен тег образа из deploy.sh}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app
  restart: unless-stopped
  env_file:
    - .env.app
  environment: &app-env
    TZ: Europe/Moscow
    # Ключи хаба обязаны совпадать у сервера и у тех, кто публикует.
    MERCURE_PUBLISHER_KEY: ${MERCURE_PUBLISHER_KEY:?ключ издателя Mercure}
    MERCURE_SUBSCRIBER_KEY: ${MERCURE_SUBSCRIBER_KEY:?ключ подписчика Mercure}
    MERCURE_HUB_URL: http://app/.well-known/mercure
  volumes: *data
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      <<: *app-env
      ACME_EMAIL: ${ACME_EMAIL:-proverka@xcar.ru}
      SITE_ADDRESSES: ${SITE_ADDRESSES:-http://localhost}
      REDIRECT_ADDRESSES: ${REDIRECT_ADDRESSES:-http://redirect.localhost}
      REDIRECT_TO: ${REDIRECT_TO:-localhost}
      REDIRECT_SCHEME: ${REDIRECT_SCHEME:-https}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      - ${XCAR_DATA:-/srv/xcar/data}/storage:/app/storage
      - ${XCAR_DATA:-/srv/xcar/data}/media:/app/storage/app/media
      - ${XCAR_DATA:-/srv/xcar/data}/private:/app/storage/app/private
      - ${XCAR_DATA:-/srv/xcar/data}/cache:/app/storage/app/cache
  - ${XCAR_HOT:-/srv/xcar/hot}:/app/storage/app/hot
      # Сертификаты. Терять нельзя: Let's Encrypt считает попытки.
      - caddy_data:/data
      - caddy_config:/config

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600 --memory=384 --sleep=3 --queue=notifications,default
    healthcheck:
      disable: true

  # Долгие задачи (выкачка фото, разбор ящика) — своим соединением с большим
  # retry_after, чтобы работник не считал их зависшими.
  queue-long:
    <<: *app
    command: php artisan queue:work database-long --tries=2 --max-time=3600 --memory=256 --sleep=5 --queue=long,mail
    # Минута на SIGTERM: короткие задачи дочитываются, длинную выкачку добирает повтор джобы.
    stop_grace_period: 60s
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true

  # IMAP IDLE: по процессу на активный ящик, надсмотрщик внутри команды.
  mail-watch:
    <<: *app
    command: php artisan mail:watch
    healthcheck:
      disable: true

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?имя базы}
      POSTGRES_USER: ${DB_USERNAME:?пользователь базы}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?пароль базы}
      TZ: Europe/Moscow
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
      # Тела писем — большие text-поля; lz4 жмёт их быстрее pglz.
      - -c
      - default_toast_compression=lz4
    volumes:
      # С 18-й версии монтировать надо /var/lib/postgresql, не .../data.
      - ${XCAR_DATA:-/srv/xcar/data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:

# IPv6 в контейнерах нужен ради Telegram: до api.telegram.org с сервера по
# IPv4 не достучаться, по IPv6 отвечает сразу. Подсеть локальная (ULA),
# наружу Docker выпускает через NAT66 сам. Смена сети требует `down` и `up`.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:aca2::/64
